version: 2

# The archives are named after it (powerpipe.darwin.arm64.tar.gz), and the Homebrew formula reads those names: set here, so
# the name never depends on the checkout's folder or remote.
project_name: powerpipe

builds:
  - id: powerpipe-linux-arm64
    binary: powerpipe
    goos:
      - linux
    goarch:
      - arm64

    env:
      - CC=gcc
      - CXX=g++
      - CGO_ENABLED=1
      - GOFLAGS=
      - CGO_LDFLAGS=

    # Custom ldflags.
    #
    # Default: '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser'
    # Templates: allowed
    ldflags:
      # Go Releaser analyzes your Git repository and identifies the most recent Git tag (typically the highest version number) as the version for your release.
      # This is how it determines the value of {{.Version}}.
      - -s -w -X main.version={{.Version}} -X main.date={{.Date}} -X main.commit={{.Commit}} -X main.builtBy=goreleaser

    tags: []

  - id: powerpipe-linux-amd64
    binary: powerpipe
    goos:
      - linux
    goarch:
      - amd64

    env:
      - CC=x86_64-linux-gnu-gcc
      - CXX=x86_64-linux-gnu-g++
      - CGO_ENABLED=1
      - GOFLAGS=
      - CGO_LDFLAGS=

    ldflags:
      - -s -w -X main.version={{.Version}} -X main.date={{.Date}} -X main.commit={{.Commit}} -X main.builtBy=goreleaser

    tags: []

  - id: powerpipe-darwin-arm64
    binary: powerpipe
    goos:
      - darwin
    goarch:
      - arm64

    env:
      - CC=oa64-clang
      - CXX=oa64-clang++

    ldflags:
      - -s -w -X  main.version={{.Version}} -X main.date={{.Date}} -X main.commit={{.Commit}} -X main.builtBy=goreleaser

  - id: powerpipe-darwin-amd64
    binary: powerpipe
    goos:
      - darwin
    goarch:
      - amd64

    env:
      - CC=o64-clang
      - CXX=o64-clang++

    ldflags:
      - -s -w -X  main.version={{.Version}} -X main.date={{.Date}} -X main.commit={{.Commit}} -X main.builtBy=goreleaser

archives:
  - format: tar.gz
    id: homebrew
    name_template: "{{ .ProjectName }}.{{ .Os }}.{{ .Arch }}"
    files:
      - none*

# it is necessary to specify the name_template of the snapshot, or else the snapshot gets created with
# two dash(-) which results in a 500 error while downloading
snapshot:
  name_template: "{{ incpatch .Version }}-next"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  prerelease: auto
