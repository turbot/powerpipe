name: "09 - CI"

# One entry point for every PR check. The `ci` job at the end is the only check
# a branch rule needs to require: it fails when any check below failed or was
# cancelled, and passes when one was skipped on purpose (a path filter).
# Add a new PR check as a job here (or inside a workflow called from here) and
# list it in the `ci` job's `needs`.
on:
  pull_request:
  # A release PR's record starts this by hand when the PR tests did not run on its head.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    uses: ./.github/workflows/10-test-lint.yaml
    secrets: inherit

  acceptance:
    name: acceptance
    uses: ./.github/workflows/11-test-acceptance.yaml
    secrets: inherit

  ci:
    name: ci
    if: ${{ always() }}
    needs: [lint, acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a needed job ended $r"; exit 1 ;;
            esac
          done
